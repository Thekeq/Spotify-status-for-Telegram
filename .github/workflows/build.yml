name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --windowed --collect-data customtkinter --hidden-import pystray._win32 --name SpotifyStatus app.py
      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyStatus
          path: dist/SpotifyStatus.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/SpotifyStatus.exe
